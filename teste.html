<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste de regressão - Cadastro</title>
</head>
<body>

<h1>Teste de regressão - Cadastro</h1>
<ul id="resultado"></ul>
<p id="resumo"></p>

<script src="cadastro.js"></script>
<script>
  const valido = {
    nome: "Ana",
    email: "",
    senha: "123456",
    confirmar: "123456",
    cpf: "123.456.789-09",
    endereco: "Rua A, 10"
  };

  // copia o cadastro válido trocando só um campo
  function com(campo, valor) {
    return Object.assign({}, valido, { [campo]: valor });
  }

  let passou = 0;
  let falhou = 0;

  function teste(descricao, condicao) {
    const li = document.createElement("li");
    if (condicao) {
      li.textContent = "PASSOU: " + descricao;
      li.style.color = "green";
      passou++;
    } else {
      li.textContent = "FALHOU: " + descricao;
      li.style.color = "red";
      falhou++;
    }
    document.getElementById("resultado").appendChild(li);
  }

  teste("cadastro válido não tem erros", validarCadastro(valido).length === 0);
  teste("rejeita nome vazio", validarCadastro(com("nome", "")).length === 1);
  teste("rejeita e-mail inválido", validarCadastro(com("email", "ana")).length === 1);
  teste("rejeita senha curta", validarCadastro(com("senha", "123")).length === 2);
  teste("rejeita senhas diferentes", validarCadastro(com("confirmar", "654321")).length === 1);
  teste("rejeita CPF com menos de 11 números", validarCadastro(com("cpf", "123")).length === 1);
  teste("aceita CPF com pontos e traço", validarCadastro(com("cpf", "123.456.789-09")).length === 0);
  teste("rejeita endereço vazio", validarCadastro(com("endereco", "")).length === 1);

  // salvar no localStorage (guarda e restaura os dados reais)
  const backup = localStorage.getItem("cadastros");
  localStorage.removeItem("cadastros");
  salvarCadastro(valido);
  const salvos = JSON.parse(localStorage.getItem("cadastros"));
  teste("salva o cadastro no localStorage", salvos.length === 1 && salvos[0].email === "ana@email.com");
  if (backup === null) {
    localStorage.removeItem("cadastros");
  } else {
    localStorage.setItem("cadastros", backup);
  }

  document.getElementById("resumo").textContent =
    "Passou: " + passou + " | Falhou: " + falhou;
</script>

</body>
</html>
